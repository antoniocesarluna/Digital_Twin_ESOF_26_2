name: g1-campus-domain
on:
  pull_request: { paths: ["campus_domain/**", "schemas/**", "examples/**", "openapi/**", "tools/**", "tests/**"] }
  push: { branches: [main], tags: ["g1-v*"] }
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt ruff mypy
      - name: Lint e tipos
        run: ruff check campus_domain tools tests && mypy campus_domain --ignore-missing-imports
      - name: Contrato e OpenAPI regenerados = versionados
        run: |
          rm -rf examples/valid examples/invalid schemas/json schemas/jsonld schemas/vocab
          python tools/build_contract.py && python tools/build_openapi.py
          git diff --exit-code
      - name: Testes (contrato, domínio, serviço, propriedades) com cobertura >= 85%
        run: pytest -q --cov=campus_domain --cov-fail-under=85
  breaking-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Política de versionamento (seção 6.1)
        run: |
          BASE=$(git describe --tags --abbrev=0 --match 'g1-v*' HEAD^ 2>/dev/null || true)
          if [ -n "$BASE" ]; then python tools/detectar_breaking_change.py --base "$BASE"; fi
  conformidade-gml:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt lxml
      - name: CityGML exportado x XSD oficiais da OGC (requer rede)
        run: python tools/validar_gml_ogc.py
  servico:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - name: Imagem do serviço e smoke test
        run: |
          docker build -t g1-campus-domain .
          docker run -d -p 8001:8001 --name g1 g1-campus-domain
          for i in $(seq 1 20); do curl -fs localhost:8001/saude && break; sleep 1; done
          curl -fs localhost:8001/vocabularios/categoriaUso > /dev/null
  publicar:
    runs-on: ubuntu-latest
    needs: [qualidade, conformidade-gml, servico]
    if: startsWith(github.ref, 'refs/tags/g1-v')
    steps:
      - uses: actions/checkout@v4
      - run: pip install build && python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            openapi/campus-domain.openapi.json
