name: g1-campus-domain
on:
  pull_request: { paths: ["g1/**", "schemas/**", "examples/**"] }
  push: { tags: ["g1-v*"] }
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt ruff mypy
      - name: Lint e tipos
        run: ruff check campus_domain && mypy campus_domain --ignore-missing-imports
      - name: Contrato regenerado = contrato versionado
        run: python tools/build_contract.py && git diff --exit-code schemas examples
      - name: Testes unitários, de contrato e de propriedade (cobertura >= 85%)
        run: pytest -q --cov=campus_domain --cov-fail-under=85
  conformidade-gml:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4            # schemas OGC em cache: validação sem rede (RNF-05)
        with: { path: .ogc-schemas, key: ogc-citygml-3.0-gml-3.2 }
      - run: pip install -r requirements.txt && python tools/validar_gml_ogc.py --schemas .ogc-schemas
  breaking-change:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python tools/detectar_breaking_change.py --base "$(git describe --tags --abbrev=0 --match 'g1-v*')"
  publicar:
    runs-on: ubuntu-latest
    needs: [qualidade, conformidade-gml]
    if: startsWith(github.ref, 'refs/tags/g1-v')
    steps:
      - uses: actions/checkout@v4
      - run: pip install build && python -m build
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*\nschemas/**" }
